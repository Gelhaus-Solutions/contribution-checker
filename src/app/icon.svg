<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Same geometry as components/brand-mark.tsx, but with literal colors.
       A favicon is rendered with no stylesheet, so the Tailwind classes the
       component uses would resolve to nothing and the icon would be invisible.
       #006be4 is the cobalt --primary token resolved to sRGB. -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="8" fill="#006be4" fill-opacity="0.12" stroke="#006be4" stroke-opacity="0.4" stroke-width="1.25"/>
  <path d="M10 16.5l4 4 8-9" stroke="#006be4" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22.5" cy="9" r="2.25" fill="#006be4"/>
</svg>
