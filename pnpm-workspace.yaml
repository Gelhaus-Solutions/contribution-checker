# pnpm 11 reads its settings here, no longer from the "pnpm" field in package.json.

# Only these two run their install scripts, as before. The others arrive prebuilt
# or fetch on demand (the Prisma CLI downloads its engine when it is missing).
allowBuilds:
  "@sentry/node-cpu-profiler": true
  "@sentry/cli": true
  "@prisma/client": false
  "@prisma/engines": false
  prisma: false
  protobufjs: false
  unrs-resolver: false
  "@parcel/watcher": false
  "@swc/core": false
  core-js: false
  esbuild: false
  msgpackr-extract: false

overrides:
  deepmerge-ts: ^8.0.2
  vite: ^7.3.6
  "@auth/core": ^0.41.3
  "@grpc/grpc-js": ^1.14.5
  browserslist: ^4.28.7
  fast-uri: ^3.1.7
  js-yaml: ^4.3.2
  nanoid: ^3.3.18
  postcss: ^8.5.18
  # Only the vulnerable 7.x releases: Temporal 1.25 takes protobufjs 8 as a peer.
  "protobufjs@<7.6.1": ^7.6.1
  sharp: ^0.35.4
  shell-quote: ^1.9.0
  minimatch@3>brace-expansion: ^1.1.16
  minimatch@10>brace-expansion: ^5.0.11

# Our own scope is published from our own repositories, so the release-age hold only delays us.
minimumReleaseAgeExclude:
  - "@ghub/*"
