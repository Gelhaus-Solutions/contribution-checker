services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      # BUILD_ID auto-derives from the git checkout (6-char commit sha) inside the
      # build — nothing to pass. Override only if you want a custom value:
      #   args: { BUILD_ID: "v1.2.3" }
    image: contribution-checker:latest
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=file:/app/data/contribution-checker.db
      # Point the app + worker at the local Temporal dev server below. mTLS is
      # off for local dev; production sets TEMPORAL_TLS_ENABLED=true and supplies
      # the client cert/key via Vault.
      - TEMPORAL_HOST=temporal
      - TEMPORAL_PORT=7233
      - TEMPORAL_NAMESPACE=default
      - TEMPORAL_TASK_QUEUE=contribution-checker
      - TEMPORAL_TLS_ENABLED=false
      # Worker Deployments + heartbeats. TEMPORAL_BUILD_ID is derived from the
      # git sha at build time and exported by the container entrypoint — do NOT
      # set it here. The worker auto-promotes its Build ID to Current on startup.
      - TEMPORAL_VERSIONING_ENABLED=true
      - TEMPORAL_DEPLOYMENT_NAME=contribution-checker
      - TEMPORAL_SET_CURRENT_ON_START=true
    volumes:
      - data:/app/data
    ports:
      - ${PORT}:3000
    depends_on:
      temporal:
        condition: service_started

  # Local Temporal dev server (in-memory). Frontend gRPC on 7233, Web UI on 8233.
  # Production uses a real self-hosted cluster reached over mTLS instead.
  temporal:
    image: temporalio/temporal:latest
    # frontend.workerHeartbeatsEnabled powers Worker Deployment visibility +
    # worker/version heartbeats. On a real cluster, set it in the server's
    # dynamicconfig YAML instead (see below).
    command: >
      server start-dev --ip 0.0.0.0 --log-level warn
      --dynamic-config-value frontend.workerHeartbeatsEnabled=true
    restart: unless-stopped
    ports:
      - "7233:7233"
      - "8233:8233"

volumes:
  data:
