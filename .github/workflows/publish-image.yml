# Build the container image and publish it to GHCR.
#
# This replaces nothing: the image at reg.ennogelhaus.de was built by hand, and
# the repository has never carried a pipeline. It exists because gitlab is being
# decommissioned and the running production container
# (contribute-checker-app-1 on docker-prod) is the ONLY thing left that pulls
# from that registry.
#
# Every job runs on github-runner, the self-hosted pool on the LAN. This
# repository is public, and a fork's pull request could run whatever it likes
# in the job it triggers, so every job skips a pull request whose head is not
# in this repository: a fork's pull request gets no CI here.
#
# This publishes the amd64 image docker-prod pulls. The arm64 image for AWS is
# built by a workflow in aws-configs, which checks this repository out at a ref.
name: publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gelhaus-solutions/contribution-checker

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # No GitHub cache: the pnpm store lives in the runner's shared folder
      # (GHA_LOCAL_CACHE), or in the checkout on a runner without one. A cache
      # only makes the job faster, so a folder that cannot be made falls back
      # rather than failing.
      - name: pnpm store
        run: |
          store="${GHA_LOCAL_CACHE:-$GITHUB_WORKSPACE/.cache}/pnpm-store"
          mkdir -p "$store" 2>/dev/null || store="$GITHUB_WORKSPACE/.cache/pnpm-store"
          echo "npm_config_store_dir=$store" >> "$GITHUB_ENV"
      # corepack activates the pnpm that `packageManager` in package.json pins.
      - name: pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      # prisma generate first: typecheck reads the generated client.
      - run: pnpm run db:generate
      - run: pnpm run typecheck
      # `pnpm run lint` is deliberately NOT here. The script exists but no
      # ESLint config does, so `next lint` drops into its interactive
      # "How would you like to configure ESLint?" setup and exits 1. Lint has
      # therefore never run in this repository, on any CI, and choosing a
      # baseline for it is a separate decision from keeping the image building.
      - run: pnpm run test

  image:
    needs: verify
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux]
    # Pull requests build to prove the Dockerfile still works; only this
    # repository's main and tags push.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The Dockerfile derives its Temporal Build ID from `git rev-parse` in
          # the build context, so the checkout needs to be a real repository.
          fetch-depth: 0

      - name: log in to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # The short sha stays the primary tag: production runs
          # contribution-checker:<short-sha> today and the compose file names it
          # that way, so the convention is load-bearing rather than cosmetic.
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      # No setup-buildx-action and no cache-from/cache-to: its docker-container
      # builder starts empty every run. The default docker driver keeps the
      # layers and the Dockerfile's cache mounts (pnpm store, Next webpack
      # cache) in the runner's own Docker between runs.
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
