# Typecheck and tests on every push to main and every pull request; on main
# and on tags, the image for linux/amd64 and linux/arm64, each built natively
# in its own job (D26), so neither waits for the other.
#
# GitHub-hosted, never the home runners: this repository is public, and a
# pull request, a fork's included, runs whatever it likes in the job it
# triggers. Pull requests get the verify job only, with a read-only token. No
# cache.
#
# Images go to ghcr.io/gelhaus-solutions/contribution-checker as
# <sha12>-<arch>, which the edge stack in aws-configs runs; latest-<arch>
# follows main. Once both images of a commit on main are pushed, the deploy
# job has aws-configs run it on the edge (its deploy-cc workflow, D45 there).
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/gelhaus-solutions/contribution-checker

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      # corepack activates the pnpm that `packageManager` in package.json pins.
      - name: pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack prepare --activate
      - run: pnpm install --frozen-lockfile
      # prisma generate first: typecheck reads the generated client.
      - run: pnpm run db:generate
      - run: pnpm run typecheck
      # `pnpm run lint` is not here: no ESLint config exists, so `next lint`
      # opens its interactive setup and exits 1.
      - run: pnpm run test

  image:
    needs: verify
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags
        id: tags
        env:
          ARCH: ${{ matrix.arch }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tags="$IMAGE:${GITHUB_SHA::12}-$ARCH"
          if [ "$REF" = refs/heads/main ]; then
            tags="$tags,$IMAGE:latest-$ARCH"
            # docker-prod pulls :latest until the move to AWS.
            [ "$ARCH" = amd64 ] && tags="$tags,$IMAGE:latest"
          fi
          case "$REF" in refs/tags/v*) tags="$tags,$IMAGE:$REF_NAME-$ARCH" ;; esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          provenance: false
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            BUILD_ID=${{ github.sha }}

  # aws-configs pins this commit and applies the edge only when the plan
  # changes nothing but this image; anything else waits for a person there.
  # The token may run that repository's workflows and nothing else
  # (fine-grained, Actions read and write on aws-configs alone). Without it
  # nothing is deployed, and the job says so by failing.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: dispatch aws-configs' deploy-cc
        env:
          TOKEN: ${{ secrets.AWS_CONFIGS_DEPLOY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AWS_CONFIGS_DEPLOY_TOKEN is not set: ${GITHUB_SHA::12} was not deployed"
            exit 1
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Gelhaus-Solutions/aws-configs/actions/workflows/deploy-cc.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"version\":\"${GITHUB_SHA::12}\"}}"
          echo "${GITHUB_SHA::12} handed to aws-configs: https://github.com/Gelhaus-Solutions/aws-configs/actions/workflows/deploy-cc.yml" >> "$GITHUB_STEP_SUMMARY"
